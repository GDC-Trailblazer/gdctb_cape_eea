[build-system]
requires = ["setuptools>=45",
            "setuptools_scm[toml]>=6.2",
            "wheel"]
build-backend = 'setuptools.build_meta'

[project]
name = "gdctb_cape_eea"
description = "A Python package to process and analyze data from the GDCTB CAPE EEA instrument."
readme = "README.rst"
dynamic = ["version"]
authors = [{name = "Steven Christe", email="steven.d.christe@nasa.gov"},
           {name = "Damian Barrous Dumme", email="damianbarrous@gmail.com"}]
license = {file = "LICENSE.rst"}
requires-python = ">=3.9"
keywords = ["gdctb", "nasa mission", "space weather"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache 2.0",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  'swxsoc',
  'ccsdspy @ git+https://github.com/ddasilva/ccsdspy.git'
]

[project.optional-dependencies]
dev = [
  'coverage>=5.0.3',
  'pytest==8.0.0',
  'pytest-astropy==0.11.0',
  'pytest-cov==4.1.0',
  'black==24.1.1',
  'flake8==7.0.0',
  'coverage[toml]==7.4.1'
]

docs = [
  'sphinx==7.2.6',
  'sphinx-automodapi==0.16.0'
]

test = [
  'pytest==8.0.0',
  'pytest-astropy==0.11.0',
  'pytest-cov==4.1.0',
  'coverage[toml]==7.4.1'
]

style = [
  'black==24.1.1',
  'flake8==7.0.0'
]

[tool.setuptools.package-data]
"gdctb_cape_eea.data" = ["**"]

[tool.setuptools]
packages = ["gdctb_cape_eea"]

[tool.setuptools_scm]
write_to = "gdctb_cape_eea/_version.py"

[tool.pytest.ini_options]
testpaths = [
   "gdctb_cape_eea/tests",
   "docs"
]

doctest_plus = "enabled"
text_file_format = "rst"
addopts = "--doctest-rst"


[tool.coverage.run]
omit = [
  'gdctb_cape_eea/__init*',
  'gdctb_cape_eea/conftest.py',
  'gdctb_cape_eea/*setup_package*',
  'gdctb_cape_eea/tests/*',
  'gdctb_cape_eea/*/tests/*',
  'gdctb_cape_eea/extern/*',
  'gdctb_cape_eea/version*',
  '*/gdctb_cape_eea/__init*',
  '*/gdctb_cape_eea/conftest.py',
  '*/gdctb_cape_eea/*setup_package*',
  '*/gdctb_cape_eea/tests/*',
  '*/gdctb_cape_eea/*/tests/*',
  '*/gdctb_cape_eea/extern/*',
  '*/gdctb_cape_eea/version*',
]

[tool.black]
extend-exclude = '''gdctb_cape_eea/_version.py'''
